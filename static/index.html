<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stephen's AI Thought Partner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }

    /* Markdown prose */
    .prose { max-width: none; line-height: 1.65; }
    .prose p  { margin-bottom: 0.6rem; }
    .prose ul, .prose ol { margin: 0.4rem 0 0.6rem 1.4rem; }
    .prose li { margin-bottom: 0.2rem; }
    .prose h1,.prose h2,.prose h3 { font-weight: 600; margin: 0.8rem 0 0.4rem; }
    .prose code { background: rgba(0,0,0,0.07); padding: 0.12em 0.35em; border-radius: 4px; font-size: 0.85em; font-family: ui-monospace, monospace; }
    .prose pre  { background: rgba(0,0,0,0.06); padding: 0.85rem; border-radius: 8px; overflow-x: auto; margin: 0.6rem 0; }
    .prose pre code { background: none; padding: 0; }
    .prose strong { font-weight: 600; }
    .prose blockquote { border-left: 3px solid #cbd5e1; padding-left: 0.9rem; color: #64748b; margin: 0.6rem 0; }
    .prose a { color: #4f46e5; text-decoration: underline; }

    /* Status dots */
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .dot-idle    { background: #cbd5e1; }
    .dot-loading { background: #f59e0b; animation: blink 1.4s ease-in-out infinite; }
    .dot-done    { background: #10b981; }
    .dot-error   { background: #ef4444; }

    @keyframes blink {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.5; transform:scale(.85); }
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(10px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .fade-up { animation: fadeUp .35s ease forwards; }

    /* Cards */
    .model-card {
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
      transition: box-shadow .2s;
    }
    .model-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.09); }

    .consolidated-wrap {
      background: linear-gradient(135deg,#eef2ff,#f5f3ff);
      border: 2px solid #c7d2fe;
      border-radius: 16px;
    }

    textarea:focus { outline: none; box-shadow: 0 0 0 3px rgba(99,102,241,.2); }
    button:disabled { opacity: .6; cursor: not-allowed; }

    /* Copy button on cards */
    .copy-btn { opacity: 0; transition: opacity .15s; }
    .model-card:hover .copy-btn { opacity: 1; }

    /* Print styles */
    @media print {
      header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      #input-section { display: none !important; }
      .no-print { display: none !important; }
      .model-card { break-inside: avoid; page-break-inside: avoid; }
      .consolidated-wrap { break-inside: avoid; }
      body { background: white; }
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">

<!-- ── Header ──────────────────────────────────────────────────────── -->
<header class="sticky top-0 z-20 shadow-md" style="background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);">
  <div class="max-w-7xl mx-auto px-5 py-3.5 flex items-center gap-3.5">
    <!-- Icon -->
    <div class="flex-shrink-0 w-9 h-9 rounded-xl flex items-center justify-center" style="background: linear-gradient(135deg, #6366f1, #a855f7); box-shadow: 0 0 16px rgba(139,92,246,0.6);">
      <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
          d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
      </svg>
    </div>
    <!-- Title -->
    <div>
      <h1 class="text-lg font-bold leading-tight tracking-tight" style="background: linear-gradient(90deg, #e0e7ff, #c4b5fd, #f0abfc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
        Stephen's AI Thought Partner
      </h1>
      <p class="text-xs" style="color: rgba(196,181,253,0.65);">Claude &middot; ChatGPT &middot; Gemini &middot; Grok</p>
    </div>
    <!-- Phase badge -->
    <div class="ml-auto flex items-center gap-2" id="phase-badge" style="display:none!important">
      <span class="dot dot-loading" id="phase-dot"></span>
      <span class="text-sm font-medium" style="color: #c4b5fd;" id="phase-text"></span>
    </div>
  </div>
</header>

<!-- ── Main ────────────────────────────────────────────────────────── -->
<main class="max-w-7xl mx-auto px-5 py-8 space-y-10">

  <!-- Question input -->
  <div id="input-section" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
    <label class="block text-sm font-semibold text-slate-700 mb-2">Your question</label>
    <textarea
      id="q"
      rows="3"
      class="w-full border border-slate-200 rounded-xl p-4 text-slate-800 text-base resize-none transition-all"
      placeholder="Ask anything… e.g. 'What are the pros and cons of microservices vs monoliths?'"
    ></textarea>
    <!-- File attachment row -->
    <div class="mt-3">
      <label class="cursor-pointer inline-flex items-center gap-1.5 text-sm text-slate-500 hover:text-indigo-600 transition-colors select-none">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
        </svg>
        Attach files
        <input
          type="file" id="file-input" class="hidden"
          accept=".pdf,.txt,.md,.rtf,.png,.jpg,.jpeg,.gif,.webp"
          multiple
          onchange="fileSelected(this)"
        />
      </label>
      <div id="file-badges" class="flex flex-wrap gap-2 mt-2"></div>
    </div>

    <div class="flex items-center justify-between mt-4">
      <p class="text-xs text-slate-400">All four models answer, then critique each other, then a consolidated answer is produced.</p>
      <button
        id="submit-btn"
        onclick="askBoard()"
        class="bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold px-5 py-2.5 rounded-xl transition-colors flex items-center gap-2 text-sm"
      >
        Ask the Board
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Round 1: Initial answers -->
  <section id="sec-initial" class="hidden">
    <div class="flex items-baseline gap-3 mb-4">
      <h2 class="text-base font-bold text-slate-800">Initial Answers</h2>
      <span class="text-xs font-semibold text-slate-400 uppercase tracking-widest">Round 1</span>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
      <div id="card-claude-initial"  class="model-card min-h-[120px]"></div>
      <div id="card-chatgpt-initial" class="model-card min-h-[120px]"></div>
      <div id="card-gemini-initial"  class="model-card min-h-[120px]"></div>
      <div id="card-grok-initial"    class="model-card min-h-[120px]"></div>
    </div>
  </section>

  <!-- Round 2: Discussion -->
  <section id="sec-discuss" class="hidden">
    <div class="flex items-baseline gap-3 mb-4">
      <h2 class="text-base font-bold text-slate-800">Discussion &amp; Critique</h2>
      <span class="text-xs font-semibold text-slate-400 uppercase tracking-widest">Round 2</span>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
      <div id="card-claude-critique"  class="model-card min-h-[120px]"></div>
      <div id="card-chatgpt-critique" class="model-card min-h-[120px]"></div>
      <div id="card-gemini-critique"  class="model-card min-h-[120px]"></div>
      <div id="card-grok-critique"    class="model-card min-h-[120px]"></div>
    </div>
  </section>

  <!-- Consolidated answer -->
  <section id="sec-consolidated" class="hidden">
    <div class="flex items-baseline gap-3 mb-4">
      <h2 class="text-base font-bold text-slate-800">Consolidated Answer</h2>
      <span class="text-xs font-semibold text-slate-400 uppercase tracking-widest">Final</span>
    </div>
    <div class="consolidated-wrap p-7">
      <div class="flex items-center gap-2 mb-5">
        <span class="text-xl">✨</span>
        <span class="font-semibold text-slate-700">Board Consensus</span>
      </div>
      <div id="consolidated-body" class="prose text-slate-700 text-sm"></div>
      <!-- Toolbar -->
      <div id="result-toolbar" class="hidden no-print flex items-center gap-2 mt-6 pt-5 border-t border-indigo-200">
        <button onclick="copyConsolidated()" id="copy-btn"
          class="flex items-center gap-1.5 text-sm font-medium text-indigo-700 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 px-3.5 py-2 rounded-lg transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
          </svg>
          Copy Answer
        </button>
        <button onclick="window.print()"
          class="flex items-center gap-1.5 text-sm font-medium text-slate-600 bg-white hover:bg-slate-50 border border-slate-200 px-3.5 py-2 rounded-lg transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>
          </svg>
          Print
        </button>
      </div>
    </div>
  </section>

</main>

<script>
// ── Raw markdown store (for copying) ────────────────────────────────
let consolidatedMd = '';

// ── Copy helpers ─────────────────────────────────────────────────────
function copyText(text, btnEl) {
  navigator.clipboard.writeText(text).then(() => {
    if (!btnEl) return;
    const orig = btnEl.innerHTML;
    btnEl.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`;
    setTimeout(() => { btnEl.innerHTML = orig; }, 1500);
  });
}

function copyConsolidated() {
  const btn = document.getElementById('copy-btn');
  navigator.clipboard.writeText(consolidatedMd).then(() => {
    const orig = btn.innerHTML;
    btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Copied!`;
    setTimeout(() => { btn.innerHTML = orig; }, 1800);
  });
}

// ── Model metadata ──────────────────────────────────────────────────
const MODELS = {
  claude:  { name:'Claude',  org:'Anthropic', topColor:'#D97706', bg:'#FFFBEB', borderColor:'#FCD34D', text:'#78350F' },
  chatgpt: { name:'ChatGPT', org:'OpenAI',    topColor:'#059669', bg:'#ECFDF5', borderColor:'#6EE7B7', text:'#064E3B' },
  gemini:  { name:'Gemini',  org:'Google',    topColor:'#2563EB', bg:'#EFF6FF', borderColor:'#93C5FD', text:'#1E3A8A' },
  grok:    { name:'Grok',    org:'xAI',       topColor:'#7C3AED', bg:'#F5F3FF', borderColor:'#C4B5FD', text:'#4C1D95' },
};

// ── Helpers ─────────────────────────────────────────────────────────
function loadingCard(key) {
  const m = MODELS[key];
  return `
    <div style="border-top:4px solid ${m.topColor}; background:${m.bg}" class="p-4 h-full">
      <div class="flex items-center justify-between mb-3">
        <span class="font-semibold text-sm" style="color:${m.text}">${m.name}</span>
        <span class="text-xs opacity-60" style="color:${m.text}">${m.org}</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="dot dot-loading"></span>
        <span class="text-xs text-slate-400">Thinking…</span>
      </div>
    </div>`;
}

function contentCard(key, md) {
  const m = MODELS[key];
  const escaped = md.replace(/\\/g, '\\\\').replace(/`/g, '\\`');
  return `
    <div style="border-top:4px solid ${m.topColor}; background:${m.bg}" class="p-4 h-full fade-up">
      <div class="flex items-center justify-between mb-3">
        <span class="font-semibold text-sm" style="color:${m.text}">${m.name}</span>
        <div class="flex items-center gap-2">
          <button class="copy-btn no-print p-1 rounded hover:bg-black/10 transition-colors" title="Copy"
            onclick="copyText(\`${escaped}\`, this)">
            <svg class="w-3.5 h-3.5" style="color:${m.text}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
          </button>
          <span class="dot dot-done"></span>
          <span class="text-xs opacity-60" style="color:${m.text}">${m.org}</span>
        </div>
      </div>
      <div class="prose text-xs text-slate-700">${marked.parse(md)}</div>
    </div>`;
}

function errorCard(key, msg) {
  const m = MODELS[key];
  return `
    <div style="border-top:4px solid #ef4444; background:#fff1f2" class="p-4 h-full fade-up">
      <div class="flex items-center justify-between mb-3">
        <span class="font-semibold text-sm text-red-700">${m.name}</span>
        <span class="dot dot-error"></span>
      </div>
      <p class="text-xs text-red-600">${msg}</p>
    </div>`;
}

function setPhase(phase, msg) {
  const badge = document.getElementById('phase-badge');
  const dot   = document.getElementById('phase-dot');
  const text  = document.getElementById('phase-text');
  badge.style.display = 'flex';
  text.textContent = msg;
  if (phase === 'done') {
    dot.className = 'dot dot-done';
  } else {
    dot.className = 'dot dot-loading';
  }
}

function show(id) {
  document.getElementById(id).classList.remove('hidden');
}

// ── File helpers ─────────────────────────────────────────────────────
let selectedFiles = [];

function fileSelected(input) {
  Array.from(input.files).forEach(f => selectedFiles.push(f));
  input.value = '';
  renderFileBadges();
}

function removeFile(index) {
  selectedFiles.splice(index, 1);
  renderFileBadges();
}

function renderFileBadges() {
  const container = document.getElementById('file-badges');
  container.innerHTML = selectedFiles.map((f, i) => `
    <div class="flex items-center gap-1.5 px-3 py-1 bg-indigo-50 border border-indigo-200 text-indigo-700 rounded-full text-xs font-medium">
      <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
      <span>${f.name}</span>
      <button onclick="removeFile(${i})" class="ml-1 hover:text-red-500 font-bold leading-none">×</button>
    </div>
  `).join('');
}

// ── Main logic ──────────────────────────────────────────────────────
async function askBoard() {
  const qEl  = document.getElementById('q');
  const btn  = document.getElementById('submit-btn');
  const question = qEl.value.trim();
  if (!question) { qEl.focus(); return; }

  // Reset UI
  btn.disabled = true;
  btn.textContent = 'Processing…';
  document.getElementById('phase-badge').style.display = 'flex';

  ['sec-initial','sec-discuss','sec-consolidated'].forEach(id =>
    document.getElementById(id).classList.add('hidden')
  );
  consolidatedMd = '';
  document.getElementById('result-toolbar').classList.add('hidden');
  document.getElementById('result-toolbar').classList.remove('flex');

  // Pre-populate loading cards for round 1
  show('sec-initial');
  for (const key of Object.keys(MODELS)) {
    document.getElementById(`card-${key}-initial`).innerHTML  = loadingCard(key);
    document.getElementById(`card-${key}-critique`).innerHTML = '';
  }
  document.getElementById('consolidated-body').innerHTML = '';

  try {
    const formData = new FormData();
    formData.append('question', question);
    selectedFiles.forEach(f => formData.append('files', f));

    const resp = await fetch('/api/ask', { method: 'POST', body: formData });

    if (!resp.ok) throw new Error(`Server returned ${resp.status}`);

    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop(); // keep incomplete tail

      for (const part of parts) {
        if (!part.trim()) continue;

        // Parse SSE event + data
        let eventName = null, dataStr = null;
        for (const line of part.split('\n')) {
          if (line.startsWith('event: ')) eventName = line.slice(7).trim();
          else if (line.startsWith('data: '))  dataStr  = line.slice(6).trim();
        }
        if (!eventName || !dataStr) continue;

        let data;
        try { data = JSON.parse(dataStr); } catch { continue; }

        switch (eventName) {
          case 'phase':
            setPhase(data.phase, data.message);
            if (data.phase === 'discussion') {
              show('sec-discuss');
              for (const key of Object.keys(MODELS))
                document.getElementById(`card-${key}-critique`).innerHTML = loadingCard(key);
            }
            if (data.phase === 'consolidation') {
              show('sec-consolidated');
              document.getElementById('consolidated-body').innerHTML =
                '<div class="flex items-center gap-2 text-slate-400 text-sm"><span class="dot dot-loading"></span> Synthesising…</div>';
            }
            break;

          case 'model_answer': {
            const content = data.answer.startsWith('[Error:')
              ? errorCard(data.model, data.answer)
              : contentCard(data.model, data.answer);
            document.getElementById(`card-${data.model}-initial`).innerHTML = content;
            break;
          }

          case 'model_critique': {
            const content = data.critique.startsWith('[Error:')
              ? errorCard(data.model, data.critique)
              : contentCard(data.model, data.critique);
            document.getElementById(`card-${data.model}-critique`).innerHTML = content;
            break;
          }

          case 'consolidated':
            consolidatedMd = data.answer;
            document.getElementById('consolidated-body').innerHTML =
              marked.parse(data.answer);
            break;

          case 'done':
            setPhase('done', 'Complete ✓');
            document.getElementById('result-toolbar').classList.remove('hidden');
            document.getElementById('result-toolbar').classList.add('flex');
            btn.disabled = false;
            btn.innerHTML = `Ask Again
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
              </svg>`;
            break;

          case 'file_info':
            setPhase('processing', `Processing: ${data.filename}`);
            break;

          case 'error':
            console.error('Server error:', data.message);
            break;
        }
      }
    }

  } catch (err) {
    console.error(err);
    btn.disabled = false;
    btn.textContent = 'Ask the Board';
    setPhase('error', 'Error — see console');
    alert(`Something went wrong: ${err.message}`);
  }
}

// Cmd/Ctrl+Enter to submit
document.getElementById('q').addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') askBoard();
});

marked.setOptions({ breaks: true, gfm: true });
</script>
</body>
</html>
